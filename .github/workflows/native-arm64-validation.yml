name: Native ARM64 Validation

on:
  pull_request:
    branches: [main, ci/native-arm64-validation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - name: Verify native architecture
        run: |
          test "$(uname -m)" = aarch64
          dotnet --info
      - name: Full backend suite
        run: >-
          dotnet test tests/Sportarr.Api.Tests/Sportarr.Api.Tests.csproj
          -c Release -p:SkipFrontendBuild=true --nologo
          --logger 'trx;LogFileName=native-arm64.trx'
          --results-directory TestResults
      - name: Record full RSS workload
        env:
          SPORTARR_RSS_BENCHMARK: '1'
        run: >-
          dotnet test tests/Sportarr.Api.Tests/Sportarr.Api.Tests.csproj
          -c Release -p:SkipFrontendBuild=true --no-build --nologo
          --filter FullyQualifiedName~RssMatchingBenchmarkTests
          --logger 'console;verbosity=detailed'
          --logger 'trx;LogFileName=rss-arm64.trx'
          --results-directory TestResults
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-arm64-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

  image-smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Verify native architecture
        run: |
          test "$(uname -m)" = aarch64
          test "$(docker info --format '{{.Architecture}}')" = aarch64
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Publish container binaries
        run: |
          cp -R _output/UI/. src/wwwroot/
          dotnet publish src/Sportarr.csproj -c Release -r linux-arm64 --self-contained false -p:PublishSingleFile=false -p:SkipFrontendBuild=true -o publish/docker-linux-arm64
          mkdir -p publish/docker-linux-x64
      - name: Build existing application image
        run: docker build --platform linux/arm64 --build-arg CACHEBUST="$GITHUB_RUN_ID" --tag sportarr-validation:arm64 .
      - name: Smoke test startup and restart
        run: bash .github/scripts/smoke-container.sh sportarr-validation:arm64